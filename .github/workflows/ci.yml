name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: 测试与代码质量检查
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 代码格式检查 (Black)
      run: |
        black --check src/ tests/ tools/ --line-length=120
      continue-on-error: true

    - name: 代码规范检查 (Flake8)
      run: |
        flake8 src/ tests/ tools/ --max-line-length=120 --ignore=E203,W503,E501
      continue-on-error: true

    - name: 运行单元测试
      run: |
        pytest tests/ --ignore-glob='tests/test_e2e*.py' --ignore-glob='tests/test_agent*.py' --ignore-glob='tests/test_api*.py' -v
      continue-on-error: false

    - name: 运行集成验证
      run: |
        python scripts/verify_integration.py
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      continue-on-error: true

  security:
    name: 安全扫描
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 运行安全扫描 (Bandit)
      run: |
        pip install bandit
        bandit -r src/ tools/ -ll
      continue-on-error: true

    - name: 依赖漏洞扫描 (Safety)
      run: |
        pip install safety
        pip freeze | safety check --stdin
      continue-on-error: true
