title: 数据库死锁处理
description: 处理 MySQL 死锁问题的诊断和解决流程
keywords:
  - 数据库
  - 死锁
  - deadlock
  - mysql
  - 1205
  - lock
severity_match:
  - P1
  - P2
category: database

check_steps:
  - 查看死锁日志（SHOW ENGINE INNODB STATUS）
  - 分析事务持有的锁（information_schema.innodb_locks）
  - 检查慢查询日志（slow query log）
  - 查看当前活跃事务（show processlist）
  - 确认是否有长事务未提交

fix_steps:
  - 短期解决：kill 阻塞的长事务
  - 优化事务顺序（统一锁获取顺序，避免循环等待）
  - 减少事务持有锁的时间（拆分大事务）
  - 添加合适的索引减少锁范围
  - 如果是批量操作导致：调整批次大小

escalation_conditions:
  - 死锁频率 > 10 次/分钟
  - 影响核心业务流程（订单、支付）
  - 持续时间 > 30 分钟
  - 优化后仍频繁出现

related_docs:
  - https://wiki.internal/mysql-deadlock-guide
  - https://dev.mysql.com/doc/refman/8.0/en/innodb-deadlocks.html
  - https://wiki.internal/transaction-best-practices
