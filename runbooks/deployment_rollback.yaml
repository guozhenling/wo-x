title: 部署回滚流程
description: 发布后出现问题的标准回滚步骤
keywords:
  - 部署
  - 发布
  - 回滚
  - rollback
  - deployment
  - release
severity_match:
  - P0
  - P1
category: deployment

check_steps:
  - 确认问题出现在发布之后（对比发布时间）
  - 检查发布的版本号和提交记录
  - 确认回滚目标版本（上一个稳定版本）
  - 评估回滚影响范围（是否影响数据库、配置等）
  - 检查灰度流量配置

fix_steps:
  - 停止灰度流量（设置灰度比例为 0）
  - 执行回滚命令（kubectl rollout undo deployment <service-name>）
  - 等待 Pod 重启完成（kubectl rollout status）
  - 验证回滚后功能正常（运行冒烟测试）
  - 通知相关团队（研发、测试、产品）
  - 分析问题原因并记录

escalation_conditions:
  - 回滚失败或超时
  - 回滚后问题仍然存在
  - 影响全量用户
  - 涉及不可逆的数据变更

related_docs:
  - https://wiki.internal/deployment-guide
  - https://wiki.internal/rollback-checklist
  - https://wiki.internal/deployment-history
