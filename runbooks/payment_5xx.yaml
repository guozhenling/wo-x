title: 支付 5xx 错误处理
description: 处理支付接口返回 5xx 错误的标准流程
keywords:
  - 支付
  - 5xx
  - payment
  - gateway
  - timeout
  - 503
  - 502
severity_match:
  - P0
  - P1
category: availability

check_steps:
  - 检查支付网关状态（curl gateway.internal/health）
  - 检查数据库连接（show processlist）
  - 查看最近 1 小时的部署记录
  - 检查错误率趋势（Grafana）
  - 确认影响范围（用户数、金额）

fix_steps:
  - 如果网关返回 503：切换到备用支付通道（payment_backup）
  - 如果数据库超时：重启连接池（kubectl rollout restart payment-service）
  - 如果部署后出现：回滚到上一版本（git revert && deploy）
  - 如果持续时间 > 10 分钟：升级为 P0，通知 on-call

escalation_conditions:
  - 持续时间超过 10 分钟
  - 影响用户超过 1000 人
  - 错误率持续上升
  - 备用方案也失败

related_docs:
  - https://wiki.internal/payment-architecture
  - https://grafana.internal/payment-dashboard
  - https://runbook.internal/payment-incident-history
